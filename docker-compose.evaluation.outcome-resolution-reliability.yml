# Calibration-only reliability profile for US-F0-13-T18e.
#
# Layer last after docker-compose.evaluation.yml. It enables enforcement and
# bind-mounts the isolated triage-v2 / gpt-5-mini organization fixture without
# changing the normal organization, historical profiles, frozen plans, or
# existing evidence.

services:
  api:
    environment:
      HIVE__OUTCOMES__MODE: "enforcement"
    volumes:
      - type: bind
        source: ./config/experiments/hybrid-outcome-resolution-reliability-v1/organization.yaml
        target: /app/config/organizations/acme-delivery/organization.yaml
        read_only: true
