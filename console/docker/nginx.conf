# Serves the console bundle and the public API from one origin.
#
# Same-origin is the point: the console then issues no cross-origin request, so
# it works against an API host that declares no CORS policy. Only the public
# `/api/v1` prefix is proxied — `/internal`, `/health` and `/diagnostics` are
# deliberately not reachable through the console.

map $http_upgrade $hive_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration is rewritten on every container start; a cached copy
    # would silently pin a stale organization or a revoked credential.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR upgrades this connection to a websocket; without these the hub
        # silently degrades to the polling fallback.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hive_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed bundle assets are immutable; index.html must not be cached or a
    # deploy keeps serving the previous bundle's asset references.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
